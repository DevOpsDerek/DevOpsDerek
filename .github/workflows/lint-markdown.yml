name: Lint Markdown

on:
  pull_request:
    paths:
      - README.md
      - docs/**/*.md
      - .markdownlint-cli2.jsonc
      - .github/workflows/lint-markdown.yml
  push:
    branches: [main]
    paths:
      - README.md
      - docs/**/*.md
      - .markdownlint-cli2.jsonc
      - .github/workflows/lint-markdown.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown:
    uses: DevOpsDerek/workflows/.github/workflows/lint-markdown.yml@35ec3f531b5eb0f0f42f232f23e1dc5735e36c35
    with:
      working-directory: .
      markdown-paths: |
        README.md
        docs/**/*.md
    permissions:
      contents: read

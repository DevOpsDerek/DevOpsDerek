name: Lint Markdown

on:
  pull_request:
    paths:
      - README.md
      - docs/**/*.md
      - .markdownlint-cli2.jsonc
      - .github/workflows/lint-markdown.yml
  push:
    branches: [main]
    paths:
      - README.md
      - docs/**/*.md
      - .markdownlint-cli2.jsonc
      - .github/workflows/lint-markdown.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown:
    uses: DevOpsDerek/workflows/.github/workflows/lint/markdown.yml@cd4f07509e9efb0c498217c3be352e762bd0c149
    with:
      working-directory: .
      markdown-paths: |
        README.md
        docs/**/*.md
    permissions:
      contents: read

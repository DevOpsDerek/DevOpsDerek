name: Lint Markdown

on:
  pull_request:
    paths:
      - README.md
      - docs/**/*.md
      - .markdownlint-cli2.jsonc
      - .github/workflows/lint-markdown.yml
  push:
    branches: [main]
    paths:
      - README.md
      - docs/**/*.md
      - .markdownlint-cli2.jsonc
      - .github/workflows/lint-markdown.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown:
    uses: DevOpsDerek/workflows/.github/workflows/lint-markdown.yml@5ecebff22598835cbf5ccd7bfa07c036cce22ee9
    with:
      working-directory: .
      markdown-paths: |-
        README.md
        docs/**/*.md
    permissions:
      contents: read
